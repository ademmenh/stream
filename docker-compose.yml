services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - net
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./atlas
      - migrate
      - apply
      - --dir
      - file:///app/migrations
      - --url
      - postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    networks:
      - net
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT:           ${PORT:-8000}
      DB_HOST:        ${DB_HOST}
    volumes:
      - logs:/app/logs
    networks:
      - net
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-8000}/api/v${API_VERSION:-1}/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    networks:
      - net
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    container_name: go-starter-nginx
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      API_HOST:   app
      API_PORT:   ${PORT:-8000}
      S3_HOST:    s3
      S3_PORT:    ${S3_PORT:-9000}
    networks:
      - net
    volumes:
      - ./nginx/templates/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  pgdata:
  logs:
  s3data:

networks:
  net:
    driver: bridge
